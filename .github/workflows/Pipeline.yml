name: Pipeline

on:
  push:
  workflow_dispatch:
  schedule:
# Every Friday at 22:00 - rerun pipeline to check for dependency-based issues
    - cron: '0 22 * * 5'

permissions:
  actions:  write
  contents: write
  pages:    write
  id-token: write

jobs:
  Pipeline:
    uses: pyTooling/Actions/.github/workflows/CompletePipeline.yml@r9
    with:
      package_namespace: 'pyEDAA'
      package_name:      'IPXACT'
      unittest_python_version_list: '3.11 3.12 3.13 3.14 3.15 pypy-3.11 pypy-3.12'
      # lxml publishes PyPy wheels only for PyPy 7.3, but setup-python installs PyPy 8.0: pip builds lxml from source,
      # which fails without the libxml2/libxslt headers. macOS has them. Enable again when lxml has PyPy 8.0 wheels.
      unittest_disable_list:        'ubuntu:pypy-3.11 ubuntu:pypy-3.12 ubuntu-arm:pypy-3.11 ubuntu-arm:pypy-3.12 windows:pypy-3.11 windows:pypy-3.12 windows-arm:pypy-3.11 windows-arm:pypy-3.12'
      bandit:            'true'
      pylint:            'false'
      codecov:           'true'
      codacy:            'true'
      dorny:             'true'
      cleanup:           'false'
    secrets:
      PYPI_TOKEN:    ${{ secrets.PYPI_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CODACY_TOKEN:  ${{ secrets.CODACY_TOKEN }}
